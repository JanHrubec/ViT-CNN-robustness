dataset:
  n_per_class: 5
  pool_per_class: 50
  cache_dir: data/imagenet_val_cache
  batch_size: 128
  num_workers: 4

models:
  names:
    - resnet101_in1k
    - vit_b16_in1k
    - convnext_small_in1k

corruptions:
  rotation_degrees: [-60, -54, -48, -42, -36, -30, -24, -18, -12, -6, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60]
  translation_pixels: []
  gaussian_sigmas: [0.025, 0.05, 0.075, 0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25, 0.275, 0.30, 0.325, 0.35, 0.375, 0.40, 0.425, 0.45, 0.475, 0.50]

evaluation:
  device: auto
  seed: 42
  num_repeats: 3
  topk: [1, 5]
  bootstrap_iters: 1000
  save_per_sample: true

metrics:
  enable_topk: true
  enable_nll: true
  enable_ece: true
  ece_bins: 15
  enable_stability: true

output:
  output_dir: ./results
  run_name: base
