dataset:
  name: cifar100
  root: ./data/cifar100
  n_per_class: 50
  batch_size: 128
  num_workers: 4

models:
  names:
    - resnet101
    - vit_b_16
    - convnext_small

corruptions:
  rotation_degrees: [-30, -25, -20, -15, -12, -9, -6, -3, 0, 3, 6, 9, 12, 15, 20, 25, 30]
  translation_pixels: [-16, -14, -12, -10, -8, -6, -4, -2, 0, 2, 4, 6, 8, 10, 12, 14, 16]
  gaussian_sigmas: [0.0, 0.01, 0.02, 0.03, 0.05, 0.07, 0.10, 0.12, 0.15, 0.20]

evaluation:
  device: auto
  seed: 42
  topk: [1, 5]
  bootstrap_iters: 1000
  save_per_sample: true

metrics:
  enable_topk: true
  enable_nll: true
  enable_ece: true
  ece_bins: 15
  enable_stability: true

output:
  output_dir: ./results
  run_name: baseline
