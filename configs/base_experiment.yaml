dataset:
  name: cifar100
  root: ./data/cifar100
  subset_per_class: 10
  batch_size: 64
  num_workers: 4

models:
  names:
    - resnet18
    - vit_b_32
    - convnext_tiny

corruptions:
  # Symmetric sweeps reduce directional bias in analysis.
  rotation_degrees: [-30, -20, -15, -10, -5, 0, 5, 10, 15, 20, 30]
  translation_pixels: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
  gaussian_sigmas: [0.0, 0.02, 0.05, 0.10, 0.15]

evaluation:
  device: auto            # auto, cpu, cuda, mps
  seed: 42
  topk: [1, 5]
  bootstrap_iters: 1000
  save_per_sample: true

metrics:
  enable_topk: true
  enable_nll: true
  enable_ece: true
  ece_bins: 15
  enable_stability: true

output:
  output_dir: ./results
  run_name: baseline
